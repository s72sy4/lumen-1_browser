[package]
name = "lumen-1_browser"
version = "0.1.1"
edition = "2021"

[dependencies]
gtk = "0.18"
gdk = "0.18"
gio = "0.18"
glib = "0.18"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
image = "0.25"
chrono = "0.4"
url = "2"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
